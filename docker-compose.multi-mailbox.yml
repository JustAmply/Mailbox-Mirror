services:
  mailbox-mirror-a:
    image: ghcr.io/justamply/mailbox-mirror:latest
    container_name: mailbox-mirror-a
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Europe/Berlin
      HOST1: ${MAILBOX_A_HOST1:-}
      PORT1: ${MAILBOX_A_PORT1:-993}
      USER1: ${MAILBOX_A_USER1:-}
      PASSWORD1: ${MAILBOX_A_PASSWORD1:-}
      PASSWORD1_FILE: ${MAILBOX_A_PASSWORD1_FILE:-}
      SSL1: ${MAILBOX_A_SSL1:-true}
      AUTHMECH1: ${MAILBOX_A_AUTHMECH1:-}
      HOST2: ${MAILBOX_A_HOST2:-}
      PORT2: ${MAILBOX_A_PORT2:-993}
      USER2: ${MAILBOX_A_USER2:-}
      PASSWORD2: ${MAILBOX_A_PASSWORD2:-}
      PASSWORD2_FILE: ${MAILBOX_A_PASSWORD2_FILE:-}
      SSL2: ${MAILBOX_A_SSL2:-true}
      AUTHMECH2: ${MAILBOX_A_AUTHMECH2:-}
      DRY_RUN: ${MAILBOX_A_DRY_RUN:-false}
      MAXAGE_DAYS: ${MAILBOX_A_MAXAGE_DAYS:-}
      IMAPSYNC_EXTRA_ARGS: ${MAILBOX_A_IMAPSYNC_EXTRA_ARGS:-}
      FOLDER_INCLUDE: ${MAILBOX_A_FOLDER_INCLUDE:-}
      FOLDER_EXCLUDE: ${MAILBOX_A_FOLDER_EXCLUDE:-}
      FOLDER_MAP: ${MAILBOX_A_FOLDER_MAP:-}
      DESTINATION_PREFIX: ${MAILBOX_A_DESTINATION_PREFIX:-}
      SYNC_MODE: ${MAILBOX_A_SYNC_MODE:-additive}
      ALLOW_DELETIONS: ${MAILBOX_A_ALLOW_DELETIONS:-false}
      WEBHOOK_URL: ${MAILBOX_A_WEBHOOK_URL:-}
      WEBHOOK_FAILURE_THRESHOLD: ${MAILBOX_A_WEBHOOK_FAILURE_THRESHOLD:-3}
      HEALTHCHECK_MAX_AGE_MINUTES: ${MAILBOX_A_HEALTHCHECK_MAX_AGE_MINUTES:-}
      HEALTHCHECK_MAX_RUN_MINUTES: ${MAILBOX_A_HEALTHCHECK_MAX_RUN_MINUTES:-}
      RUN_TIMEOUT_SECONDS: ${MAILBOX_A_RUN_TIMEOUT_SECONDS:-}
      SHUTDOWN_GRACE_SECONDS: ${MAILBOX_A_SHUTDOWN_GRACE_SECONDS:-10}
      LOCK_WAIT_SECONDS: ${MAILBOX_A_LOCK_WAIT_SECONDS:-0}
      RUN_ON_STARTUP: "false"
      CRON_SCHEDULE: "0,15,30,45 * * * *"
      FOLDER_FILTER: ${MAILBOX_A_FOLDER_FILTER-INBOX}
      LOCK_FILE: /var/lock/mailbox-mirror/global.lock
    volumes:
      - imapsync-lock:/var/lock/mailbox-mirror
    # Enable only after validating the baseline RSS for your mailbox.
    # mem_limit: 256m

