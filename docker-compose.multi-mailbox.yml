      RUN_TIMEOUT_SECONDS: ${MAILBOX_C_RUN_TIMEOUT_SECONDS:-}
      SHUTDOWN_GRACE_SECONDS: ${MAILBOX_C_SHUTDOWN_GRACE_SECONDS:-10}
      LOCK_WAIT_SECONDS: ${MAILBOX_C_LOCK_WAIT_SECONDS:-0}
