# Test-only server: the integration runner uses an internal network, no host ports.
protocols = imap
listen = *
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
log_path = /dev/stderr
info_log_path = /dev/stderr
mail_location = maildir:~/Maildir
namespace inbox {
  inbox = yes
  separator = /
}
passdb {
  driver = static
  args = password=FAKE-integration-password
}
userdb {
  driver = static
  args = uid=vmail gid=vmail home=/mail/%u
}
